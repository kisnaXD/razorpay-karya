services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment:
      MONGO_URL: ${MONGO_URL}
      NODE_ENV: production
      WEB_ORIGIN: ${PUBLIC_URL}
      API_PORT: "4000"
      ORG_ID: ${ORG_ID:-org_arka}
      A2A_ORG_ID: ${A2A_ORG_ID:-org_arka}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      RAZORPAYX_KEY_ID: ${RAZORPAYX_KEY_ID:-}
      RAZORPAYX_KEY_SECRET: ${RAZORPAYX_KEY_SECRET:-}
      PAYOUT_PROVIDER: ${PAYOUT_PROVIDER:-ledger}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
      LLM_COPY_ENABLED: ${LLM_COPY_ENABLED:-false}
      BROWSER_ENABLED: ${BROWSER_ENABLED:-false}
    restart: unless-stopped
    expose:
      - "4000"

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    environment:
      NODE_ENV: production
    depends_on:
      - api
    restart: unless-stopped
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      CADDY_SITE: ${CADDY_SITE:-:80}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
